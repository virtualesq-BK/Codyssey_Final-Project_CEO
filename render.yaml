services:
  - type: web
    name: nadosajang-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5-mini
      - key: OPENAI_BASE_URL
        value: https://copa.codyssey.kr/v1
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nadosajang.db
      - key: APP_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: LAW_OC
        sync: false
    healthCheckPath: /api/v1/health
